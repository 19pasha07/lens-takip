<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Lens Kartı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 440px;
            width: 100%;
        }

        .baslik {
            text-align: center;
            margin-bottom: 24px;
        }

        .baslik h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .baslik p {
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Kontrol Paneli */
        .panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        .panel label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            margin-top: 14px;
        }

        .panel label:first-child {
            margin-top: 0;
        }

        .panel input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s;
        }

        .panel input:focus {
            border-color: #3b82f6;
            background: white;
        }

        /* Renk Seçimi */
        .renk-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .renk-btn {
            padding: 7px 14px 7px 10px;
            border-radius: 20px;
            border: 2px solid #e5e7eb;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fafafa;
            transition: all 0.15s;
        }

        .renk-btn:hover {
            transform: scale(1.04);
        }

        .renk-btn.secili {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1a1a2e;
        }

        .renk-btn .nokta {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        /* KART */
        .kart {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            overflow: hidden;
            width: 100%;
            margin-bottom: 20px;
        }

        .kart-ic {
            padding: 32px 24px 22px;
            text-align: center;
        }

        .ikon {
            width: 26px;
            height: 32px;
            margin: 0 auto 12px;
            position: relative;
        }

        .ikon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            border: 2.5px solid #1a1a2e;
            border-radius: 5px;
        }

        .ikon::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 2.5px;
            background: #1a1a2e;
            border-radius: 2px;
        }

        .kart-model-baslik {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .kart-model-adi {
            font-size: 20px;
            font-weight: 800;
            color: #1a1a2e;
            margin: 4px 0 10px;
        }

        .kart-renk-satir {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 6px;
        }

        .kart-renk-nokta {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.05);
        }

        .kart-renk-yazi {
            font-size: 16px;
            font-weight: 600;
            color: #4b5563;
        }

        .kart-numara {
            font-size: 44px;
            font-weight: 900;
            color: #1a1a2e;
            margin-top: 6px;
            letter-spacing: 3px;
            line-height: 1;
        }

        .kart-alt {
            border-top: 1px solid #e5e7eb;
            padding: 10px 24px;
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            background: #f9fafb;
            letter-spacing: 1px;
        }

        /* Buton */
        .btn-kaydet {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .btn-kaydet:hover {
            background: #2d2d4a;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(26,26,46,0.3);
        }

        .btn-kaydet:active {
            transform: scale(0.97);
        }

        .ipucu {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .toast.goster {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="baslik">
            <h1>📱 iPhone Lens Kartı</h1>
            <p>Model adını yaz, rengini seç, numarayı gir ve kaydet</p>
        </div>

        <!-- Kontroller -->
        <div class="panel">
            <label>Model Adı</label>
            <input type="text" id="model-input" placeholder="Örn: iPhone 16 128GB" value="iPhone 16 128GB">

            <label>Renk Seç</label>
            <div class="renk-grid" id="renk-grid">
                <div class="renk-btn secili" data-renk="Siyah" data-hex="#2d2d2d">
                    <span class="nokta" style="background:#2d2d2d"></span> Siyah
                </div>
                <div class="renk-btn" data-renk="Beyaz" data-hex="#f5f5f0">
                    <span class="nokta" style="background:#f5f5f0"></span> Beyaz
                </div>
                <div class="renk-btn" data-renk="Pembe" data-hex="#f4a4b8">
                    <span class="nokta" style="background:#f4a4b8"></span> Pembe
                </div>
                <div class="renk-btn" data-renk="Deniz Mavisi" data-hex="#7ec8c1">
                    <span class="nokta" style="background:#7ec8c1"></span> Deniz Mavisi
                </div>
                <div class="renk-btn" data-renk="Laciverttaş" data-hex="#4a5c8a">
                    <span class="nokta" style="background:#4a5c8a"></span> Laciverttaş
                </div>
            </div>

            <label>Numara</label>
            <input type="text" id="number-input" placeholder="Örn: 001" value="001">
        </div>

        <!-- Canlı Kart -->
        <div class="kart" id="kart">
            <div class="kart-ic">
                <div class="ikon"></div>
                <div class="kart-model-baslik" id="kart-baslik">iPhone 16 128GB</div>
                <div class="kart-model-adi" id="kart-model">iPhone 16 128GB</div>
                <div class="kart-renk-satir">
                    <span class="kart-renk-nokta" id="kart-renk-nokta" style="background:#2d2d2d"></span>
                    <span class="kart-renk-yazi" id="kart-renk-yazi">Siyah</span>
                </div>
                <div class="kart-numara" id="kart-numara">001</div>
            </div>
            <div class="kart-alt">✦ APPLE LENS KARTI ✦</div>
        </div>

        <!-- Kaydet Butonu -->
        <button class="btn-kaydet" id="kaydet-btn">📷 Resim Olarak Kaydet</button>
        <p class="ipucu">Butona tıkla, PNG resim bilgisayarına insin 💕</p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== Renkler ==========
        const RENKLER = {
            'Siyah':        '#2d2d2d',
            'Beyaz':        '#f5f5f0',
            'Pembe':        '#f4a4b8',
            'Deniz Mavisi': '#7ec8c1',
            'Laciverttaş':  '#4a5c8a'
        };

        // ========== DOM ==========
        const modelInput = document.getElementById('model-input');
        const numberInput = document.getElementById('number-input');
        const renkBtnlari = document.querySelectorAll('.renk-btn');
        const kartBaslik = document.getElementById('kart-baslik');
        const kartModel = document.getElementById('kart-model');
        const kartRenkNokta = document.getElementById('kart-renk-nokta');
        const kartRenkYazi = document.getElementById('kart-renk-yazi');
        const kartNumara = document.getElementById('kart-numara');
        const kaydetBtn = document.getElementById('kaydet-btn');
        const kart = document.getElementById('kart');
        const toast = document.getElementById('toast');

        let seciliRenk = 'Siyah';
        let seciliHex = '#2d2d2d';

        // ========== Toast ==========
        function toastGoster(msg, sure) {
            toast.textContent = msg;
            toast.classList.add('goster');
            clearTimeout(toast._zaman);
            toast._zaman = setTimeout(() => toast.classList.remove('goster'), sure || 1800);
        }

        // ========== Renk Seçimi ==========
        renkBtnlari.forEach(btn => {
            btn.addEventListener('click', function() {
                renkBtnlari.forEach(b => b.classList.remove('secili'));
                this.classList.add('secili');
                seciliRenk = this.dataset.renk;
                seciliHex = this.dataset.hex;
                canliGuncelle();
            });
        });

        // ========== Canlı Güncelle ==========
        function canliGuncelle() {
            const model = modelInput.value.trim() || 'iPhone';
            const num = numberInput.value.trim() || '---';
            kartBaslik.textContent = model;
            kartModel.textContent = model;
            kartRenkYazi.textContent = seciliRenk;
            kartRenkNokta.style.background = seciliHex;
            kartNumara.textContent = num;
        }

        modelInput.addEventListener('input', canliGuncelle);
        numberInput.addEventListener('input', canliGuncelle);

        // ========== Resim Kaydet ==========
        kaydetBtn.addEventListener('click', function() {
            const model = modelInput.value.trim().replace(/[^a-zA-Z0-9ÇçĞğİıÖöŞşÜü\- ]/g, '').replace(/\s+/g, '_') || 'iPhone';
            const renk = seciliRenk;
            const num = numberInput.value.trim() || '000';
            const dosyaAdi = model + '_' + renk + '_' + num + '.png';

            // html2canvas ile kartı çek
            html2canvas(kart, {
                scale: 2.5,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            }).then(function(canvas) {
                const link = document.createElement('a');
                link.download = dosyaAdi;
                link.href = canvas.toDataURL('image/png');
                link.click();
                toastGoster('✅ ' + dosyaAdi + ' indirildi!');
            }).catch(function(err) {
                console.error('Hata:', err);
                toastGoster('❌ Hata oldu, tekrar dene', 2500);
            });
        });

        // ========== Enter ile numara alanından kaydet ==========
        numberInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                kaydetBtn.click();
            }
        });

        // ========== Başlangıç ==========
        canliGuncelle();
    </script>

</body>
</html>
