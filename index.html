<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İPHONE LENS SİPARİŞ SİSTEMİ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f4f4f7; padding: 0; margin: 0; padding-top: 95px; }
        .container { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .main-title { text-align: center; color: #007aff; border-bottom: 3px solid #007aff; padding-bottom: 10px; margin: 0 0 10px 0; font-size: 24px; font-weight: 900; }
        .date-subtitle { text-align: center; color: #333; font-size: 16px; margin-bottom: 15px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 10px; position: fixed; top: 0; left: 0; right: 0; background: white; padding: 15px; border-bottom: 2px solid #007aff; z-index: 9999; }
        button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 11px; color: white; cursor: pointer; text-transform: uppercase; }
        .save-btn { background: #28a745; } 
        .reset-btn { background: #ff3b30; }

        .lens-group { margin-bottom: 15px; border: 2px solid #007aff; border-radius: 12px; overflow: hidden; background: white; }
        .lens-group-header { background: #007aff; color: white; padding: 12px; font-weight: bold; font-size: 14px; text-align: center; line-height: 1.4; }
        
        .model-section { border-bottom: 2px solid #e0e0e0; }
        .model-section:last-child { border-bottom: none; }
        .model-title { background: #f0f0f5; padding: 8px 12px; font-weight: bold; font-size: 15px; color: #333; }
        
        .color-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #f0f0f0; }
        .color-row:last-child { border-bottom: none; }
        .color-info { display: flex; align-items: center; gap: 12px; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); min-width: 22px; }
        
        input { width: 70px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 900; color: #333; }
        
        .save-notice { background: #1c1c1e; color: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 16px; }
        .result-item { background: #f9f9f9; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 18px; border-bottom: 1px solid #eee; }
        .result-item:last-child { border-bottom: none; }
        .result-model { font-size: 11px; color: #888; font-weight: normal; background: #e8e8ed; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
    </style>
</head>
<body>

<div class="btn-group" id="controls">
    <button class="reset-btn" onclick="window.location.reload()">TEMİZLE</button>
    <button class="save-btn" onclick="finishProcess()">LİSTELE VE RESİM OLARAK KAYDET</button>
</div>

<div class="container" id="app">
    <div id="captureArea" style="padding: 15px; background: white;">
        <h1 class="main-title">İPHONE KAMERA LENS</h1>
        <div class="date-subtitle" id="dateDisplay"></div>
        <div id="list"></div>
    </div>
</div>

<script>
    document.getElementById('dateDisplay').innerText = "Tarih: " + new Date().toLocaleDateString('tr-TR');

    const colorMap = {
        "Siyah": "#1d1d1f", "Beyaz": "#f5f5f7", "Mor": "#b8afdb", "Sarı": "#f9d023", "Yeşil": "#ade0c1", "Kırmızı": "#e11c2a",
        "Gece Yarısı": "#191f28", "Yıldız Işığı": "#faf7f2", "Mavi": "#4a7eb3", "Pembe": "#fadde5", "Altın": "#f5e3c8", "Gümüş": "#e2e4e1",
        "Gece Yeşili": "#4e5851", "Uzay Grisi": "#535150", "Pasifik Mavisi": "#28475c", "Grafit": "#4b4a45", "Sierra Mavisi": "#9ebbd7",
        "Ladin Yeşili": "#505c4d", "Uzay Siyahı": "#242323", "Derin Mor": "#594f63",
        "Beyaz Titanyum": "#f2f1ed", "Mavi Titanyum": "#3b445a", "Natürel Titanyum": "#bcb6ac", "Siyah Titanyum": "#3d3d3b",
        "Ultramarin": "#5057d0", "Turkuaz": "#b3d9d6",
        "Çöl Titanyumu": "#bba48b", "Koyu Titanyum": "#353535", "Doğal Titanyum": "#bcb6ac",
        "Turuncu": "#FF6B35",
        "Lavanta": "#d4c5e0", "Ada Çayı": "#b5c4a8", "Sis Mavisi": "#b8cdd6",
        "Gök Mavisi": "#a8d0e6", "Açık Altın": "#f0dbc0", "Bulut Beyazı": "#f8f6f0", "Uzay Siyahı (Air)": "#2c2c2e"
    };

    // ========== LENS UYUMLULUK GRUPLARI ==========
    // Her grup = aynı lens koruyucunun uyduğu modeller
    const lensGroups = [
        {
            label: "ÇİFT KAMERA (DİKEY) — AYNI LENS KORUYUCU",
            models: [
                { 
                    name: "iPhone 11", 
                    colors: ["Siyah", "Beyaz", "Mor", "Sarı", "Yeşil", "Kırmızı"] 
                },
                { 
                    name: "iPhone 12 / 12 Mini", 
                    colors: ["Siyah", "Beyaz", "Mavi", "Yeşil", "Kırmızı", "Mor"] 
                },
                { 
                    name: "iPhone 13 / 13 Mini", 
                    colors: ["Gece Yarısı", "Yıldız Işığı", "Mavi", "Pembe", "Yeşil", "Kırmızı"] 
                },
                { 
                    name: "iPhone 14 / 14 Plus", 
                    colors: ["Gece Yarısı", "Mavi", "Yıldız Işığı", "Mor", "Kırmızı", "Sarı"] 
                },
                { 
                    name: "iPhone 15 / 15 Plus", 
                    colors: ["Siyah", "Mavi", "Yeşil", "Sarı", "Pembe"] 
                },
                { 
                    name: "iPhone 16 / 16 Plus", 
                    colors: ["Siyah", "Beyaz", "Pembe", "Turkuaz", "Ultramarin"] 
                },
                { 
                    name: "iPhone 16E", 
                    colors: ["Siyah", "Beyaz"] 
                },
                { 
                    name: "iPhone 17 / 17 Plus / 17 Air", 
                    colors: ["Siyah", "Beyaz", "Sis Mavisi", "Ada Çayı", "Lavanta", "Gök Mavisi", "Açık Altın", "Bulut Beyazı", "Uzay Siyahı (Air)"] 
                }
            ]
        },
        {
            label: "ÜÇLÜ KAMERA (ÜÇGEN) — AYNI LENS KORUYUCU",
            models: [
                { 
                    name: "iPhone 11 Pro / 11 Pro Max", 
                    colors: ["Gece Yeşili", "Uzay Grisi", "Gümüş", "Altın"] 
                },
                { 
                    name: "iPhone 12 Pro / 12 Pro Max", 
                    colors: ["Pasifik Mavisi", "Grafit", "Altın", "Gümüş"] 
                },
                { 
                    name: "iPhone 13 Pro / 13 Pro Max", 
                    colors: ["Sierra Mavisi", "Grafit", "Altın", "Gümüş", "Ladin Yeşili"] 
                }
            ]
        },
        {
            label: "ÜÇLÜ KAMERA (ÜÇGEN) — AYNI LENS KORUYUCU (14 Pro - 15 Pro)",
            models: [
                { 
                    name: "iPhone 14 Pro / 14 Pro Max", 
                    colors: ["Uzay Siyahı", "Derin Mor", "Altın", "Gümüş"] 
                },
                { 
                    name: "iPhone 15 Pro / 15 Pro Max", 
                    colors: ["Siyah Titanyum", "Beyaz Titanyum", "Mavi Titanyum", "Natürel Titanyum"] 
                }
            ]
        },
        {
            label: "ÜÇLÜ KAMERA (YATAY) — AYNI LENS KORUYUCU",
            models: [
                { 
                    name: "iPhone 16 Pro / 16 Pro Max", 
                    colors: ["Siyah Titanyum", "Beyaz Titanyum", "Natürel Titanyum", "Çöl Titanyumu"] 
                },
                { 
                    name: "iPhone 17 Pro / 17 Pro Max", 
                    colors: ["Siyah Titanyum", "Beyaz Titanyum", "Doğal Titanyum", "Turuncu"] 
                }
            ]
        }
    ];

    // ========== ARAYÜZ ==========
    const listDiv = document.getElementById('list');

    lensGroups.forEach((group, gIdx) => {
        let modelsList = group.models.map(m => m.name).join(' • ');
        let html = `<div class="lens-group">
            <div class="lens-group-header">📷 ${group.label}<br><span style="font-size:11px;font-weight:normal;opacity:0.9;">${modelsList}</span></div>`;

        group.models.forEach(model => {
            html += `<div class="model-section">
                <div class="model-title">${model.name}</div>`;

            model.colors.forEach(color => {
                const code = colorMap[color] || "#555";
                let isLight = ["Beyaz", "Yıldız Işığı", "Gümüş", "Beyaz Titanyum", "Bulut Beyazı", "Açık Altın", "Natürel Titanyum", "Doğal Titanyum"].includes(color);
                let textStyle = (color === "Sarı") ? "color:#d4af37; text-shadow: 0 0 1px #000;" : (isLight ? "color:#888;" : `color:${code};`);

                html += `<div class="color-row">
                    <div class="color-info">
                        <div class="color-dot" style="background:${code}; border: 1px solid ${isLight ? '#bbb' : 'transparent'};"></div>
                        <span style="font-weight:bold; ${textStyle}">${color}</span>
                    </div>
                    <input type="number" class="lens-count" data-group="${gIdx}" data-model="${model.name}" data-color="${color}" data-code="${code}" placeholder="0">
                </div>`;
            });

            html += `</div>`;
        });

        html += `</div>`;
        listDiv.innerHTML += html;
    });

    // ========== GÖNDER / KAYDET ==========
    async function finishProcess() {
        const inputs = document.querySelectorAll('.lens-count');
        let orders = {};
        let hasOrder = false;

        inputs.forEach(input => {
            const val = parseInt(input.value);
            if (val > 0) {
                const model = input.getAttribute('data-model');
                const color = input.getAttribute('data-color');
                const code = input.getAttribute('data-code');

                if (!orders[model]) orders[model] = [];
                let existing = orders[model].find(o => o.color === color);
                if (existing) {
                    existing.count += val;
                } else {
                    orders[model].push({ color, count: val, code });
                }
                hasOrder = true;
            }
        });

        if (!hasOrder) return alert("Lütfen adet giriniz!");

        listDiv.innerHTML = "";
        for (let model in orders) {
            let gDiv = document.createElement('div');
            gDiv.className = 'lens-group';
            gDiv.innerHTML = `<div class="lens-group-header" style="background:#28a745;">${model}</div>`;
            
            orders[model].forEach(item => {
                let isLight = ["Beyaz", "Yıldız Işığı", "Gümüş", "Beyaz Titanyum", "Bulut Beyazı", "Açık Altın", "Natürel Titanyum", "Doğal Titanyum"].includes(item.color);
                let textStyle = isLight ? "color:#888;" : `color:${item.code};`;
                if (item.color === "Sarı") textStyle = "color:#d4af37;";

                gDiv.innerHTML += `<div class="result-item">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div class="color-dot" style="background:${item.code}; border:1px solid #ccc;"></div>
                        <span style="${textStyle}">${item.color}</span>
                    </div>
                    <span>${item.count} ADET</span>
                </div>`;
            });
            listDiv.appendChild(gDiv);
        }

        document.getElementById('controls').style.display = "none";
        const canvas = await html2canvas(document.querySelector("#captureArea"), { scale: 3 });
        const imgData = canvas.toDataURL("image/png");

        document.body.innerHTML = `
            <div style="text-align:center; padding:15px; background:#f4f4f7; min-height:100vh;">
                <div class="save-notice">👍 TAMAMDIR! Basılı tut ve fotoğraflara kaydet.</div>
                <img src="${imgData}" style="width:100%; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.3);">
                <button onclick="window.location.reload()" style="width:100%; margin-top:25px; padding:25px; background:#1c1c1e; color:white; border-radius:15px; font-weight:900; font-size:26px; border:none;">
                    ⬅️ ANA SAYFAYA DÖN
                </button>
            </div>`;
    }
</script>
</body>
</html>
