<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İPHONE LENS SİPARİŞ SİSTEMİ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f4f4f7; padding: 0; margin: 0; padding-top: 95px; }
        .container { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .main-title { text-align: center; color: #007aff; border-bottom: 3px solid #007aff; padding-bottom: 10px; margin: 0 0 10px 0; font-size: 24px; font-weight: 900; }
        .date-subtitle { text-align: center; color: #333; font-size: 16px; margin-bottom: 15px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 10px; position: fixed; top: 0; left: 0; right: 0; background: white; padding: 15px; border-bottom: 2px solid #007aff; z-index: 9999; }
        button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 11px; color: white; cursor: pointer; text-transform: uppercase; }
        .save-btn { background: #28a745; } 
        .reset-btn { background: #ff3b30; }

        .camera-group { margin-bottom: 15px; border: 2px solid #5856d6; border-radius: 12px; overflow: hidden; background: white; }
        .camera-group-header { background: #5856d6; color: white; padding: 10px 12px; font-weight: bold; font-size: 15px; text-align: center; }
        
        .color-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f0f0f0; }
        .color-row:last-child { border-bottom: none; }
        .color-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .color-dot { min-width: 22px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        .model-name-tag { font-size: 11px; color: #666; font-weight: normal; background: #f0f0f5; padding: 2px 7px; border-radius: 4px; margin-left: 6px; }
        
        input { width: 70px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 900; color: #333; }
        
        .save-notice { background: #1c1c1e; color: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 16px; }
        .result-item { background: #f9f9f9; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 18px; border-bottom: 1px solid #eee; }
        .result-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="btn-group" id="controls">
    <button class="reset-btn" onclick="window.location.reload()">TEMİZLE</button>
    <button class="save-btn" onclick="finishProcess()">LİSTELE VE RESİM OLARAK KAYDET</button>
</div>

<div class="container" id="app">
    <div id="captureArea" style="padding: 15px; background: white;">
        <h1 class="main-title">İPHONE KAMERA LENS</h1>
        <div class="date-subtitle" id="dateDisplay"></div>
        <div id="list"></div>
    </div>
</div>

<script>
    document.getElementById('dateDisplay').innerText = "Tarih: " + new Date().toLocaleDateString('tr-TR');

    // ========== RENK KODLARI ==========
    const colorMap = {
        "Black": "#1d1d1f", "White": "#f5f5f7", "Purple": "#b8afdb", "Yellow": "#f9d023", "Green": "#ade0c1", "Product Red": "#e11c2a",
        "Midnight": "#191f28", "Starlight": "#faf7f2", "Blue": "#4a7eb3", "Pink": "#fadde5", "Gold": "#f5e3c8", "Silver": "#e2e4e1",
        "Midnight Green": "#4e5851", "Space Gray": "#535150", "Pacific Blue": "#28475c", "Graphite": "#4b4a45", "Sierra Blue": "#9ebbd7",
        "Alpine Green": "#505c4d", "Space Black": "#242323", "Deep Purple": "#594f63",
        "White Titanium": "#f2f1ed", "Black Titanium": "#3d3d3b", "Blue Titanium": "#3b445a", "Natural Titanium": "#bcb6ac",
        "Ultramarine": "#5057d0", "Teal": "#b3d9d6", "Desert Titanium": "#bba48b",
        "Black Titanium (16 Pro)": "#2c2c2e", "White Titanium (16 Pro)": "#f0efe8", "Natural Titanium (16 Pro)": "#bcb6ac", "Desert Titanium (16 Pro)": "#d4b896",
        "Lavender": "#d4c5e0", "Sage": "#b5c4a8", "Mist Blue": "#b8cdd6",
        "Sky Blue": "#a8d0e6", "Light Gold": "#f0dbc0", "Cloud White": "#f8f6f0", "Space Black (Air)": "#2c2c2e",
        "Cosmic Orange": "#FF6B35", "Deep Blue": "#1e3a5f", "Gray": "#8a8a8e",
        "Steel Gray": "#7a7a80", "Light Blue": "#a8c8e0", "Coral": "#ff7f6b"
    };

    // ========== KAMERA GRUPLARI (fiziksel lens dizilimi aynı olanlar) ==========
    const cameraGroups = [
        {
            // iPhone 11, 12, 12 Mini, 13, 13 Mini → 2 kamera dikey (farklı boyutlarda ama aynı düzen)
            // iPhone 14, 14 Plus → 2 kamera dikey
            // iPhone 15, 15 Plus → 2 kamera dikey
            // iPhone 16, 16 Plus, 16E → 2 kamera dikey (16E tek kamera ama dikey düzende)
            // iPhone 17, 17 Plus, 17 Air → 2 kamera dikey
            name: "iPhone 11 / 12 / 12 mini / 13 / 13 mini / 14 / 14 Plus / 15 / 15 Plus / 16 / 16 Plus / 16E / 17 / 17 Plus / 17 Air",
            models: [
                { name: "iPhone 11", colors: ["Black", "White", "Purple", "Yellow", "Green", "Product Red"] },
                { name: "iPhone 12", colors: ["Black", "White", "Blue", "Green", "Product Red", "Purple"] },
                { name: "iPhone 12 Mini", colors: ["Black", "White", "Blue", "Green", "Product Red", "Purple"] },
                { name: "iPhone 13", colors: ["Midnight", "Starlight", "Blue", "Pink", "Green", "Product Red"] },
                { name: "iPhone 13 Mini", colors: ["Midnight", "Starlight", "Blue", "Pink", "Green", "Product Red"] },
                { name: "iPhone 14", colors: ["Midnight", "Blue", "Starlight", "Purple", "Product Red", "Yellow"] },
                { name: "iPhone 14 Plus", colors: ["Midnight", "Blue", "Starlight", "Purple", "Product Red", "Yellow"] },
                { name: "iPhone 15", colors: ["Black", "Blue", "Green", "Yellow", "Pink"] },
                { name: "iPhone 15 Plus", colors: ["Black", "Blue", "Green", "Yellow", "Pink"] },
                { name: "iPhone 16", colors: ["Black", "White", "Pink", "Teal", "Ultramarine"] },
                { name: "iPhone 16 Plus", colors: ["Black", "White", "Pink", "Teal", "Ultramarine"] },
                { name: "iPhone 16E", colors: ["Black", "White"] },
                { name: "iPhone 17", colors: ["Black", "White", "Mist Blue", "Sage", "Lavender"] },
                { name: "iPhone 17 Plus", colors: ["Black", "White", "Mist Blue", "Sage", "Lavender"] },
                { name: "iPhone 17 Air", colors: ["Space Black (Air)", "Cloud White", "Sky Blue", "Light Gold"] }
            ]
        },
        {
            // 3 kamera (üçgen) - Pro modeller 11-15
            name: "iPhone 11 Pro / 11 Pro Max / 12 Pro / 12 Pro Max / 13 Pro / 13 Pro Max / 14 Pro / 14 Pro Max / 15 Pro / 15 Pro Max",
            models: [
                { name: "iPhone 11 Pro", colors: ["Midnight Green", "Space Gray", "Silver", "Gold"] },
                { name: "iPhone 11 Pro Max", colors: ["Midnight Green", "Space Gray", "Silver", "Gold"] },
                { name: "iPhone 12 Pro", colors: ["Pacific Blue", "Graphite", "Gold", "Silver"] },
                { name: "iPhone 12 Pro Max", colors: ["Pacific Blue", "Graphite", "Gold", "Silver"] },
                { name: "iPhone 13 Pro", colors: ["Sierra Blue", "Graphite", "Gold", "Silver", "Alpine Green"] },
                { name: "iPhone 13 Pro Max", colors: ["Sierra Blue", "Graphite", "Gold", "Silver", "Alpine Green"] },
                { name: "iPhone 14 Pro", colors: ["Space Black", "Deep Purple", "Gold", "Silver"] },
                { name: "iPhone 14 Pro Max", colors: ["Space Black", "Deep Purple", "Gold", "Silver"] },
                { name: "iPhone 15 Pro", colors: ["Black Titanium", "White Titanium", "Blue Titanium", "Natural Titanium"] },
                { name: "iPhone 15 Pro Max", colors: ["Black Titanium", "White Titanium", "Blue Titanium", "Natural Titanium"] }
            ]
        },
        {
            // 3 kamera (yatay yeni tasarım) - 16 Pro ve 17 Pro
            name: "iPhone 16 Pro / 16 Pro Max / 17 Pro / 17 Pro Max",
            models: [
                { name: "iPhone 16 Pro", colors: ["Black Titanium (16 Pro)", "White Titanium (16 Pro)", "Natural Titanium (16 Pro)", "Desert Titanium (16 Pro)"] },
                { name: "iPhone 16 Pro Max", colors: ["Black Titanium (16 Pro)", "White Titanium (16 Pro)", "Natural Titanium (16 Pro)", "Desert Titanium (16 Pro)"] },
                { name: "iPhone 17 Pro", colors: ["Cosmic Orange", "Deep Blue", "Silver"] },
                { name: "iPhone 17 Pro Max", colors: ["Cosmic Orange", "Deep Blue", "Silver"] }
            ]
        }
    ];

    // ========== ARAYÜZ ==========
    const listDiv = document.getElementById('list');

    cameraGroups.forEach((group, gIdx) => {
        let html = `<div class="camera-group">
            <div class="camera-group-header">📷 ${group.name}</div>`;

        group.models.forEach(model => {
            model.colors.forEach(color => {
                const code = colorMap[color] || "#888";
                let isLight = ["White", "Starlight", "Silver", "White Titanium", "Cloud White", "Light Gold", "Natural Titanium", "Natural Titanium (16 Pro)", "White Titanium (16 Pro)"].includes(color);
                let textStyle = isLight ? "color:#888;" : `color:${code};`;
                if (color === "Yellow") textStyle = "color:#d4af37; text-shadow: 0 0 1px #000;";

                html += `<div class="color-row">
                    <div class="color-info">
                        <div class="color-dot" style="background:${code}; border: 1px solid ${isLight ? '#bbb' : 'transparent'};"></div>
                        <span style="font-weight:bold; ${textStyle}">
                            ${color}
                            <span class="model-name-tag">${model.name}</span>
                        </span>
                    </div>
                    <input type="number" class="lens-count" data-group="${gIdx}" data-model="${model.name}" data-color="${color}" data-code="${code}" placeholder="0">
                </div>`;
            });
        });

        html += `</div>`;
        listDiv.innerHTML += html;
    });

    // ========== GÖNDER ==========
    async function finishProcess() {
        const inputs = document.querySelectorAll('.lens-count');
        let orders = {};
        let hasOrder = false;

        inputs.forEach(input => {
            const val = parseInt(input.value);
            if (val > 0) {
                const model = input.getAttribute('data-model');
                const color = input.getAttribute('data-color');
                const code = input.getAttribute('data-code');

                if (!orders[model]) orders[model] = [];
                let existing = orders[model].find(o => o.color === color);
                if (existing) {
                    existing.count += val;
                } else {
                    orders[model].push({ color, count: val, code });
                }
                hasOrder = true;
            }
        });

        if (!hasOrder) return alert("Lütfen adet giriniz!");

        listDiv.innerHTML = "";
        for (let model in orders) {
            let gDiv = document.createElement('div');
            gDiv.className = 'camera-group';
            gDiv.innerHTML = `<div class="camera-group-header" style="background:#007aff;">${model}</div>`;
            
            orders[model].forEach(item => {
                let isLight = ["White", "Starlight", "Silver", "White Titanium", "Cloud White", "Light Gold", "Natural Titanium", "Natural Titanium (16 Pro)", "White Titanium (16 Pro)"].includes(item.color);
                let textStyle = isLight ? "color:#888;" : `color:${item.code};`;
                if (item.color === "Yellow") textStyle = "color:#d4af37;";

                gDiv.innerHTML += `<div class="result-item">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div class="color-dot" style="background:${item.code}; border:1px solid #ccc;"></div>
                        <span style="${textStyle}">${item.color}</span>
                    </div>
                    <span>${item.count} ADET</span>
                </div>`;
            });
            listDiv.appendChild(gDiv);
        }

        document.getElementById('controls').style.display = "none";
        const canvas = await html2canvas(document.querySelector("#captureArea"), { scale: 3 });
        const imgData = canvas.toDataURL("image/png");

        document.body.innerHTML = `
            <div style="text-align:center; padding:15px; background:#f4f4f7; min-height:100vh;">
                <div class="save-notice">👍 TAMAMDIR! Basılı tut ve fotoğraflara kaydet.</div>
                <img src="${imgData}" style="width:100%; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.3);">
                <button onclick="window.location.reload()" style="width:100%; margin-top:25px; padding:25px; background:#1c1c1e; color:white; border-radius:15px; font-weight:900; font-size:26px; border:none;">
                    ⬅️ ANA SAYFAYA DÖN
                </button>
            </div>`;
    }
</script>
</body>
</html>
