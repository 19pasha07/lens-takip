<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lens Kartı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .baslik {
            margin-bottom: 20px;
        }

        .baslik h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .baslik p {
            color: #6b7280;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Renk Seçimi */
        .renk-alani {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }

        .renk-alani label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .renk-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .renk-btn {
            padding: 8px 16px 8px 12px;
            border-radius: 20px;
            border: 2px solid #e5e7eb;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fafafa;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .renk-btn:active {
            transform: scale(0.95);
        }

        .renk-btn.secili {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1a1a2e;
            background: #f0f0f5;
        }

        .renk-btn .nokta {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        /* Adet Girişi */
        .adet-alani {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .adet-alani label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .adet-inputlar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .adet-inputlar input {
            width: 100px;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            outline: none;
            background: #fafafa;
        }

        .adet-inputlar input:focus {
            border-color: #3b82f6;
            background: white;
        }

        .adet-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            background: #e5e7eb;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .adet-btn:active {
            transform: scale(0.9);
            background: #d1d5db;
        }

        /* KART */
        #kart {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
            width: 100%;
        }

        .kart-ic {
            padding: 40px 24px 30px;
            text-align: center;
        }

        .ikon {
            width: 28px;
            height: 34px;
            margin: 0 auto 14px;
            position: relative;
        }

        .ikon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 27px;
            border: 2.5px solid #1a1a2e;
            border-radius: 5px;
        }

        .ikon::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 13px;
            height: 2.5px;
            background: #1a1a2e;
            border-radius: 2px;
        }

        .kart-renk-satir {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 6px 0;
        }

        .kart-renk-nokta {
            display: inline-block;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.05);
        }

        .kart-renk-yazi {
            font-size: 18px;
            font-weight: 600;
            color: #4b5563;
        }

        .kart-adet {
            font-size: 56px;
            font-weight: 900;
            color: #1a1a2e;
            margin-top: 8px;
            letter-spacing: 4px;
            line-height: 1;
        }

        .kart-alt {
            border-top: 1px solid #e5e7eb;
            padding: 10px 24px;
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            background: #f9fafb;
            letter-spacing: 1px;
        }

        /* Buton */
        .btn-kaydet {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-kaydet:active {
            transform: scale(0.96);
        }

        .ipucu {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-top: 12px;
            line-height: 1.5;
        }

        .ipucu strong {
            color: #6b7280;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1f2937;
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            white-space: nowrap;
        }

        .toast.goster {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="baslik">
            <h1>📱 Lens Kartı</h1>
            <p>Rengi seç, adedi yaz, basılı tut → fotoğraflara kaydet</p>
        </div>

        <!-- Renk Seçimi -->
        <div class="renk-alani">
            <label>Renk Seç</label>
            <div class="renk-grid" id="renk-grid">
                <div class="renk-btn secili" data-renk="Siyah" data-hex="#2d2d2d">
                    <span class="nokta" style="background:#2d2d2d"></span> Siyah
                </div>
                <div class="renk-btn" data-renk="Beyaz" data-hex="#f5f5f0">
                    <span class="nokta" style="background:#f5f5f0"></span> Beyaz
                </div>
                <div class="renk-btn" data-renk="Pembe" data-hex="#f4a4b8">
                    <span class="nokta" style="background:#f4a4b8"></span> Pembe
                </div>
                <div class="renk-btn" data-renk="Deniz Mavisi" data-hex="#7ec8c1">
                    <span class="nokta" style="background:#7ec8c1"></span> Deniz Mavisi
                </div>
                <div class="renk-btn" data-renk="Laciverttaş" data-hex="#4a5c8a">
                    <span class="nokta" style="background:#4a5c8a"></span> Laciverttaş
                </div>
            </div>
        </div>

        <!-- Adet -->
        <div class="adet-alani">
            <label>Adet</label>
            <div class="adet-inputlar">
                <button class="adet-btn" id="eksi-btn">−</button>
                <input type="number" id="adet-input" value="1" min="1" max="999">
                <button class="adet-btn" id="arti-btn">+</button>
            </div>
        </div>

        <!-- KART -->
        <div id="kart">
            <div class="kart-ic">
                <div class="ikon"></div>
                <div class="kart-renk-satir">
                    <span class="kart-renk-nokta" id="kart-renk-nokta" style="background:#2d2d2d"></span>
                    <span class="kart-renk-yazi" id="kart-renk-yazi">Siyah</span>
                </div>
                <div class="kart-adet" id="kart-adet">1</div>
            </div>
            <div class="kart-alt">✦ LENS KARTI ✦</div>
        </div>

        <!-- Buton -->
        <button class="btn-kaydet" id="kaydet-btn">📷 Fotoğraflara Kaydet</button>
        <p class="ipucu">
            💡 Butona <strong>basılı tut</strong> → "Fotoğraflara Kaydet" çıksın<br>
            <span style="font-size:12px;">Telefonda basılı tutunca resmi kaydetme seçeneği gelir</span>
        </p>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== Renkler ==========
        const RENKLER = {
            'Siyah':        '#2d2d2d',
            'Beyaz':        '#f5f5f0',
            'Pembe':        '#f4a4b8',
            'Deniz Mavisi': '#7ec8c1',
            'Laciverttaş':  '#4a5c8a'
        };

        // ========== DOM ==========
        const renkBtnlari = document.querySelectorAll('.renk-btn');
        const adetInput = document.getElementById('adet-input');
        const eksiBtn = document.getElementById('eksi-btn');
        const artiBtn = document.getElementById('arti-btn');
        const kartRenkNokta = document.getElementById('kart-renk-nokta');
        const kartRenkYazi = document.getElementById('kart-renk-yazi');
        const kartAdet = document.getElementById('kart-adet');
        const kaydetBtn = document.getElementById('kaydet-btn');
        const kart = document.getElementById('kart');
        const toast = document.getElementById('toast');

        let seciliRenk = 'Siyah';
        let seciliHex = '#2d2d2d';

        // ========== Toast ==========
        function toastGoster(msg, sure) {
            toast.textContent = msg;
            toast.classList.add('goster');
            clearTimeout(toast._zaman);
            toast._zaman = setTimeout(() => toast.classList.remove('goster'), sure || 1800);
        }

        // ========== Renk Seçimi ==========
        renkBtnlari.forEach(btn => {
            btn.addEventListener('click', function() {
                renkBtnlari.forEach(b => b.classList.remove('secili'));
                this.classList.add('secili');
                seciliRenk = this.dataset.renk;
                seciliHex = this.dataset.hex;
                canliGuncelle();
            });
        });

        // ========== Adet ==========
        function adetGuncelle() {
            let val = parseInt(adetInput.value) || 1;
            if (val < 1) val = 1;
            if (val > 999) val = 999;
            adetInput.value = val;
            canliGuncelle();
        }

        adetInput.addEventListener('input', adetGuncelle);

        eksiBtn.addEventListener('click', function() {
            let val = parseInt(adetInput.value) || 1;
            if (val > 1) val--;
            adetInput.value = val;
            canliGuncelle();
        });

        artiBtn.addEventListener('click', function() {
            let val = parseInt(adetInput.value) || 1;
            if (val < 999) val++;
            adetInput.value = val;
            canliGuncelle();
        });

        // ========== Canlı Güncelle ==========
        function canliGuncelle() {
            const adet = adetInput.value || '1';
            kartRenkYazi.textContent = seciliRenk;
            kartRenkNokta.style.background = seciliHex;
            kartAdet.textContent = adet;
        }

        // ========== Resmi Göster / Kaydet ==========
        // html2canvas kullanmadan direkt görsel oluşturma
        function kartToImage() {
            return new Promise(function(resolve, reject) {
                // Canvas oluştur
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Kart boyutları
                const genislik = 380;
                const yukseklik = 250;
                canvas.width = genislik;
                canvas.height = yukseklik;

                // Arka plan
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, genislik, yukseklik);

                // Yuvarlak köşe kes
                ctx.beginPath();
                ctx.roundRect(0, 0, genislik, yukseklik, 18);
                ctx.clip();

                // Kart içi
                const icY = 30;
                
                // İkon (basit elma şekli)
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.roundRect(genislik/2 - 11, icY, 22, 27, 5);
                ctx.fill();
                ctx.fillRect(genislik/2 - 6.5, icY + 27, 13, 3);
                
                // Renk noktası
                ctx.beginPath();
                ctx.arc(genislik/2 - 16, icY + 62, 11, 0, Math.PI * 2);
                ctx.fillStyle = seciliHex;
                ctx.fill();
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Renk yazısı
                ctx.fillStyle = '#4b5563';
                ctx.font = '600 18px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(seciliRenk, genislik/2 + 8, icY + 62);

                // Adet
                ctx.fillStyle = '#1a1a2e';
                ctx.font = '900 56px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(adetInput.value || '1', genislik/2, icY + 140);

                // Alt çizgi
                ctx.fillStyle = '#e5e7eb';
                ctx.fillRect(20, 205, genislik - 40, 1);

                // Alt yazı
                ctx.fillStyle = '#9ca3af';
                ctx.font = '500 10px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✦ LENS KARTI ✦', genislik/2, 226);

                resolve(canvas);
            });
        }

        // roundRect polyfill (eski tarayıcılar için)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ========== Buton - Basılı Tut / Tıkla ==========
        let basiliZaman = null;
        let basiliCalisti = false;

        kaydetBtn.addEventListener('click', function(e) {
            // Kısa tıklamada da kaydet
            if (!basiliCalisti) {
                kaydetmeYap();
            }
            basiliCalisti = false;
        });

        // Touch için basılı tut
        kaydetBtn.addEventListener('touchstart', function(e) {
            basiliCalisti = false;
            basiliZaman = setTimeout(function() {
                basiliCalisti = true;
                kaydetmeYap();
                toastGoster('📷 Fotoğraflara kaydediliyor...');
            }, 400);
        }, { passive: true });

        kaydetBtn.addEventListener('touchend', function(e) {
            if (basiliZaman) {
                clearTimeout(basiliZaman);
                basiliZaman = null;
            }
        });

        kaydetBtn.addEventListener('touchcancel', function(e) {
            if (basiliZaman) {
                clearTimeout(basiliZaman);
                basiliZaman = null;
            }
        });

        // Mouse için basılı tut
        kaydetBtn.addEventListener('mousedown', function(e) {
            basiliCalisti = false;
            basiliZaman = setTimeout(function() {
                basiliCalisti = true;
                kaydetmeYap();
                toastGoster('📷 Fotoğraflara kaydediliyor...');
            }, 400);
        });

        kaydetBtn.addEventListener('mouseup', function(e) {
            if (basiliZaman) {
                clearTimeout(basiliZaman);
                basiliZaman = null;
            }
        });

        kaydetBtn.addEventListener('mouseleave', function(e) {
            if (basiliZaman) {
                clearTimeout(basiliZaman);
                basiliZaman = null;
            }
        });

        // ========== Kaydetme İşlemi ==========
        function kaydetmeYap() {
            const renk = seciliRenk;
            const adet = adetInput.value || '1';
            const dosyaAdi = renk + '_' + adet + '.png';

            kartToImage().then(function(canvas) {
                // Telefonda fotoğraflara kaydetmek için blob oluştur
                canvas.toBlob(function(blob) {
                    // Önce link ile dene (Safari/Chrome)
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = dosyaAdi;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // iOS Safari için ayrıca yeni pencerede aç
                    // (telefonda basılı tutunca "Fotoğraflara Kaydet" çıkar)
                    setTimeout(function() {
                        window.open(url, '_blank');
                    }, 300);

                    setTimeout(function() {
                        URL.revokeObjectURL(url);
                    }, 10000);

                    toastGoster('✅ ' + renk + ' ' + adet + ' adet');
                }, 'image/png');
            }).catch(function(err) {
                console.error('Hata:', err);
                toastGoster('❌ Hata oldu tekrar dene', 2500);
            });
        }

        // ========== Başlangıç ==========
        canliGuncelle();
    </script>

</body>
</html>
