<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Renk Paleti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            padding: 16px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 14px;
        }
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: #f5f5f7;
            padding: 10px 0 14px;
            border-bottom: 1px solid #e8e8ed;
        }
        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-foto { background: #34c759; color: white; }
        .btn-foto:hover { background: #28a745; transform: scale(1.03); }
        .btn-select { background: #0071e3; color: white; padding: 11px 18px; font-size: 14px; }
        .btn-select:hover { background: #0077ed; }
        .btn-clear { background: #6c757d; color: white; padding: 11px 18px; font-size: 14px; }
        .btn-clear:hover { background: #5a6268; }

        #searchInput {
            padding: 10px 14px;
            border: 2px solid #d2d2d7;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            width: 220px;
        }
        #searchInput:focus { border-color: #0071e3; }

        .stats {
            text-align: center;
            color: #86868b;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .model-group {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
        }
        .model-group h2 {
            font-size: 17px;
            color: #1d1d1f;
            margin-bottom: 2px;
        }
        .model-group .sub {
            font-size: 11px;
            color: #86868b;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .card {
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e8e8ed;
            cursor: pointer;
            background: white;
            transition: 0.12s;
        }
        .card.selected { border-color: #0071e3; box-shadow: 0 0 0 1px #0071e3; background: #f0f7ff; }
        .card:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.06); }

        .swatch {
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .swatch .check {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #0071e3;
            font-weight: bold;
            opacity: 0;
        }
        .card.selected .swatch .check { opacity: 1; }

        .info { padding: 8px 8px 10px; }
        .info .name { font-size: 12px; font-weight: 600; color: #1d1d1f; margin-bottom: 5px; }
        .info .adet {
            width: 100%;
            padding: 5px 6px;
            border: 1px solid #d2d2d7;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
            text-align: center;
            background: #fafafa;
            font-weight: 500;
        }
        .info .adet:focus { border-color: #0071e3; background: white; }
        .info .adet::placeholder { font-weight: 400; font-size: 11px; color: #aaa; }

        #outputArea {
            display: none;
            max-width: 520px;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        #outputArea h3 {
            font-size: 16px;
            color: #1d1d1f;
            margin-bottom: 14px;
        }
        #outputArea .note {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 14px;
        }
        #outputInner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #outputInner .foto-card {
            background: #f9f9fb;
            border-radius: 14px;
            padding: 10px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #e8e8ed;
        }
        #outputInner .foto-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            cursor: pointer;
        }
        #outputInner .foto-label {
            font-size: 12px;
            color: #555;
            margin-top: 6px;
            font-weight: 500;
        }
        .btn-clear-output {
            margin-top: 6px;
            background: #ff3b30;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear-output:hover { background: #d63031; }

        .toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1d1d1f;
            color: white;
            padding: 12px 24px;
            border-radius: 11px;
            font-size: 14px;
            opacity: 0;
            transition: 0.35s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); }
            h1 { font-size: 20px; }
            .top-bar { gap: 6px; }
            .btn { padding: 9px 16px; font-size: 13px; }
            .btn-foto { padding: 9px 20px; }
        }
    </style>
</head>
<body>

<h1>📱 iPhone Renk Paleti</h1>

<div class="top-bar">
    <button class="btn btn-foto" onclick="fotografOlustur()">📸 Fotoğraf Oluştur</button>
    <button class="btn btn-select" onclick="tumunuSec()">Tümünü Seç</button>
    <button class="btn btn-clear" onclick="temizleSecim()">Temizle</button>
    <input type="text" id="searchInput" placeholder="🔍 Ara..." oninput="filtrele()">
</div>

<div class="stats" id="stats">Seçili: 0 renk</div>

<div class="container" id="app"></div>

<div id="outputArea">
    <h3>🖼️ Fotoğraflar</h3>
    <div class="note">👇 Basılı tut → "Fotoğraflara Kaydet"</div>
    <div id="outputInner"></div>
    <button class="btn-clear-output" onclick="ciktiTemizle()">Temizle</button>
</div>

<div class="toast" id="toast"></div>

<script>
const colorData = [
    { model: "iPhone 11", colors: [
        { tr: "Mor", en: "Purple", hex: "#C9B8E0" }, { tr: "Sarı", en: "Yellow", hex: "#F7E87A" }, { tr: "Yeşil", en: "Green", hex: "#A8D8C9" }, { tr: "Siyah", en: "Black", hex: "#2E2E2E" }, { tr: "Beyaz", en: "White", hex: "#F0EFED" }, { tr: "Kırmızı", en: "Product Red", hex: "#D32F2F" }
    ] },
    { model: "iPhone 11 Pro / 11 Pro Max", colors: [
        { tr: "Gece Yarısı Yeşili", en: "Midnight Green", hex: "#4A5D5A" }, { tr: "Uzay Grisi", en: "Space Gray", hex: "#3A3A3C" }, { tr: "Gümüş", en: "Silver", hex: "#E3E2DC" }, { tr: "Altın", en: "Gold", hex: "#F4D7B3" }
    ] },
    { model: "iPhone 12 mini / 12", colors: [
        { tr: "Siyah", en: "Black", hex: "#2E2E2E" }, { tr: "Beyaz", en: "White", hex: "#F0EFED" }, { tr: "Kırmızı", en: "Product Red", hex: "#D32F2F" }, { tr: "Yeşil", en: "Green", hex: "#A8D8C9" }, { tr: "Mavi", en: "Blue", hex: "#5A8BB8" }, { tr: "Mor", en: "Purple", hex: "#C9B8E0" }
    ] },
    { model: "iPhone 12 Pro / 12 Pro Max", colors: [
        { tr: "Pasifik Mavisi", en: "Pacific Blue", hex: "#3B5E7D" }, { tr: "Grafit", en: "Graphite", hex: "#4B4B4F" }, { tr: "Altın", en: "Gold", hex: "#F4D7B3" }, { tr: "Gümüş", en: "Silver", hex: "#E3E2DC" }
    ] },
    { model: "iPhone 13 mini / 13", colors: [
        { tr: "Yıldız Işığı", en: "Starlight", hex: "#EDE8DF" }, { tr: "Gece Yarısı", en: "Midnight", hex: "#232B32" }, { tr: "Mavi", en: "Blue", hex: "#3976A8" }, { tr: "Pembe", en: "Pink", hex: "#F5B7B1" }, { tr: "Kırmızı", en: "Product Red", hex: "#D32F2F" }, { tr: "Yeşil", en: "Green", hex: "#86B89A" }
    ] },
    { model: "iPhone 13 Pro / 13 Pro Max", colors: [
        { tr: "Sierra Mavisi", en: "Sierra Blue", hex: "#7A9EB3" }, { tr: "Alp Yeşili", en: "Alpine Green", hex: "#576D62" }, { tr: "Altın", en: "Gold", hex: "#F4D7B3" }, { tr: "Grafit", en: "Graphite", hex: "#4B4B4F" }, { tr: "Gümüş", en: "Silver", hex: "#E3E2DC" }
    ] },
    { model: "iPhone 14 / 14 Plus", colors: [
        { tr: "Gece Yarısı", en: "Midnight", hex: "#232B32" }, { tr: "Yıldız Işığı", en: "Starlight", hex: "#EDE8DF" }, { tr: "Mavi", en: "Blue", hex: "#4A7CA8" }, { tr: "Mor", en: "Purple", hex: "#A98AC7" }, { tr: "Sarı", en: "Yellow", hex: "#F2D06B" }, { tr: "Kırmızı", en: "Product Red", hex: "#D32F2F" }
    ] },
    { model: "iPhone 14 Pro / 14 Pro Max", colors: [
        { tr: "Derin Mor", en: "Deep Purple", hex: "#6B5B8A" }, { tr: "Uzay Siyahı", en: "Space Black", hex: "#2C2C2E" }, { tr: "Gümüş", en: "Silver", hex: "#E3E2DC" }, { tr: "Altın", en: "Gold", hex: "#F4D7B3" }
    ] },
    { model: "iPhone 15 / 15 Plus", colors: [
        { tr: "Pembe", en: "Pink", hex: "#F5B7B1" }, { tr: "Sarı", en: "Yellow", hex: "#F2D06B" }, { tr: "Yeşil", en: "Green", hex: "#86B89A" }, { tr: "Mavi", en: "Blue", hex: "#5A8BB8" }, { tr: "Siyah", en: "Black", hex: "#2E2E2E" }
    ] },
    { model: "iPhone 15 Pro / 15 Pro Max", colors: [
        { tr: "Doğal Titanyum", en: "Natural Titanium", hex: "#C4BCB0" }, { tr: "Mavi Titanyum", en: "Blue Titanium", hex: "#5A7087" }, { tr: "Beyaz Titanyum", en: "White Titanium", hex: "#EAE7E0" }, { tr: "Siyah Titanyum", en: "Black Titanium", hex: "#3A3A3C" }
    ] },
    { model: "iPhone 16 / 16 Plus / 16e", colors: [
        { tr: "Ultramarin", en: "Ultramarine", hex: "#2C4F8A" }, { tr: "Deniz Yeşili", en: "Teal", hex: "#4A9A8A" }, { tr: "Pembe", en: "Pink", hex: "#F5A0A0" }, { tr: "Beyaz", en: "White", hex: "#F0EFED" }, { tr: "Siyah", en: "Black", hex: "#2E2E2E" }
    ] },
    { model: "iPhone 16 Pro / 16 Pro Max", colors: [
        { tr: "Çöl Titanyumu", en: "Desert Titanium", hex: "#C8A87C" }, { tr: "Doğal Titanyum", en: "Natural Titanium", hex: "#C4BCB0" }, { tr: "Beyaz Titanyum", en: "White Titanium", hex: "#EAE7E0" }, { tr: "Siyah Titanyum", en: "Black Titanium", hex: "#3A3A3C" }
    ] },
    { model: "iPhone 17", colors: [
        { tr: "Lavanta", en: "Lavender", hex: "#C9B8E0" }, { tr: "Ada Çayı", en: "Sage", hex: "#9AAD8A" }, { tr: "Sis Mavisi", en: "Mist Blue", hex: "#A8C4D8" }, { tr: "Beyaz", en: "White", hex: "#F0EFED" }, { tr: "Siyah", en: "Black", hex: "#2E2E2E" }
    ] },
    { model: "iPhone 17 Air", colors: [
        { tr: "Gök Mavisi", en: "Sky Blue", hex: "#7DB4D6" }, { tr: "Açık Altın", en: "Light Gold", hex: "#E8D5B0" }, { tr: "Pamuk Beyazı", en: "Cloud White", hex: "#F5F3EF" }, { tr: "Uzay Siyahı", en: "Space Black", hex: "#2C2C2E" }
    ] },
    { model: "iPhone 17 Pro / 17 Pro Max", colors: [
        { tr: "Kozmik Turuncu", en: "Cosmic Orange", hex: "#D4794A" }, { tr: "Derin Mavi", en: "Deep Blue", hex: "#2C4F7A" }, { tr: "Gümüş", en: "Silver", hex: "#E3E2DC" }
    ] }
];

let seciliRenkler = new Map(); // key -> adet sayısı

function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    colorData.forEach((g, mi) => {
        const div = document.createElement('div');
        div.className = 'model-group';
        const h2 = document.createElement('h2');
        h2.textContent = g.model;
        div.appendChild(h2);
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = g.colors.length + ' renk';
        div.appendChild(sub);
        const grid = document.createElement('div');
        grid.className = 'grid';
        g.colors.forEach((c, ci) => {
            const key = mi + '-' + ci;
            const card = document.createElement('div');
            card.className = 'card' + (seciliRenkler.has(key) ? ' selected' : '');
            const sw = document.createElement('div');
            sw.className = 'swatch';
            sw.style.background = c.hex;
            const acikRenkler = ['#F0EFED','#EDE8DF','#F5F3EF','#EAE7E0','#E3E2DC','#F5B7B1','#F4D7B3','#E8D5B0','#F2D06B','#F7E87A','#C4BCB0','#F5A0A0'];
            if (acikRenkler.includes(c.hex)) sw.style.borderBottom = '1px solid #d2d2d7';
            const chk = document.createElement('div');
            chk.className = 'check';
            chk.textContent = '✓';
            sw.appendChild(chk);
            card.appendChild(sw);
            const info = document.createElement('div');
            info.className = 'info';
            const nm = document.createElement('div');
            nm.className = 'name';
            nm.textContent = c.tr;
            info.appendChild(nm);
            const adetInput = document.createElement('input');
            adetInput.type = 'number';
            adetInput.className = 'adet';
            adetInput.placeholder = 'adet';
            adetInput.min = '0';
            adetInput.value = seciliRenkler.has(key) ? seciliRenkler.get(key) : '';
            adetInput.dataset.key = key;
            adetInput.addEventListener('click', e => e.stopPropagation());
            adetInput.addEventListener('input', function() {
                const val = this.value.trim();
                if (val && parseInt(val) > 0) {
                    seciliRenkler.set(key, parseInt(val));
                    card.classList.add('selected');
                } else {
                    seciliRenkler.delete(key);
                    card.classList.remove('selected');
                }
                guncelleStats();
            });
            info.appendChild(adetInput);
            card.appendChild(info);
            // Karta tıklayınca da adet kutusuna odaklan
            card.addEventListener('click', function() {
                adetInput.focus();
            });
            grid.appendChild(card);
        });
        div.appendChild(grid);
        app.appendChild(div);
    });
    guncelleStats();
}

function guncelleStats() {
    document.getElementById('stats').textContent = 'Seçili: ' + seciliRenkler.size + ' renk';
}

function tumunuSec() {
    document.querySelectorAll('.card').forEach(c => {
        const inp = c.querySelector('.adet');
        const key = inp.dataset.key;
        if (!seciliRenkler.has(key)) {
            seciliRenkler.set(key, 1);
            inp.value = 1;
            c.classList.add('selected');
        }
    });
    guncelleStats();
}

function temizleSecim() {
    document.querySelectorAll('.card').forEach(c => {
        const inp = c.querySelector('.adet');
        const key = inp.dataset.key;
        seciliRenkler.delete(key);
        inp.value = '';
        c.classList.remove('selected');
    });
    guncelleStats();
}

function filtrele() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.model-group').forEach(g => {
        g.style.display = g.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

function fotografOlustur() {
    if (seciliRenkler.size === 0) {
        toast('Hiç renk seçmedin! Adet yazmayı unuttun mu?');
        return;
    }

    const output = document.getElementById('outputInner');
    output.innerHTML = '';
    document.getElementById('outputArea').style.display = 'block';

    let toplam = 0;

    seciliRenkler.forEach((adet, key) => {
        const [mi, ci] = key.split('-').map(Number);
        const g = colorData[mi];
        const c = g.colors[ci];

        const canvas = document.createElement('canvas');
        canvas.width = 500;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');

        // Arkaplan
        ctx.fillStyle = c.hex;
        ctx.fillRect(0, 0, 500, 500);
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        ctx.fillRect(0, 0, 500, 3);

        const cx = 250, cy = 220;
        const fw = 148, fh = 268;
        const r = 20;

        // Telefon
        ctx.shadowColor = 'rgba(0,0,0,0.18)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;
        ctx.fillStyle = '#1a1a1a';
        yuvarlak(ctx, cx - fw/2, cy - fh/2, fw, fh, r);
        ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = c.hex;
        yuvarlak(ctx, cx - fw/2 + 6, cy - fh/2 + 6, fw - 12, fh - 12, r - 2);
        ctx.fill();

        // Dynamic Island
        ctx.fillStyle = '#1d1d1f';
        yuvarlak(ctx, cx - 38, cy - fh/2 + 10, 76, 15, 7);
        ctx.fill();

        // Model
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 17px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 4;
        ctx.fillText(g.model, cx, cy + fh/2 + 50);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        // Renk
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 5;
        ctx.fillText(c.tr, cx, cy + fh/2 + 82);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        // İngilizce
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(c.en, cx, cy + fh/2 + 102);

        // Adet
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        yuvarlak(ctx, 16, 16, 55, 34, 9);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 17px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(adet + ' adet', 43, 39);

        // Watermark
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('iPhone Renk Paleti', 250, 490);

        // Kart
        const kart = document.createElement('div');
        kart.className = 'foto-card';
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        img.alt = g.model + ' - ' + c.tr;
        kart.appendChild(img);
        const lbl = document.createElement('div');
        lbl.className = 'foto-label';
        lbl.textContent = g.model + ' — ' + c.tr + ' (' + adet + ' adet)';
        kart.appendChild(lbl);
        output.appendChild(kart);
        toplam++;
    });

    document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
    toast(toplam + ' fotoğraf oluşturuldu! Basılı tut → Fotoğraflara Kaydet');
}

function ciktiTemizle() {
    document.getElementById('outputInner').innerHTML = '';
    document.getElementById('outputArea').style.display = 'none';
}

function yuvarlak(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

render();
</script>

</body>
</html>
