<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Lens Kartı Oluşturucu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 30px 20px;
        }

        .header {
            max-width: 1000px;
            margin: 0 auto 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        .controls-bar {
            max-width: 1000px;
            margin: 0 auto 24px;
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }

        .controls-bar label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }

        .controls-bar input,
        .controls-bar select {
            padding: 9px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s;
        }

        .controls-bar input:focus,
        .controls-bar select:focus {
            border-color: #3b82f6;
            background: white;
        }

        .controls-bar .sep {
            color: #d1d5db;
            font-size: 18px;
            user-select: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1a1a2e;
            color: white;
        }

        .btn-primary:hover {
            background: #2d2d4a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,26,46,0.25);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: #059669;
            color: white;
        }

        .btn-success:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* Renk seçici */
        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .color-pill {
            padding: 5px 12px 5px 8px;
            border-radius: 20px;
            border: 2px solid #e5e7eb;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fafafa;
            transition: all 0.15s;
        }

        .color-pill:hover {
            transform: scale(1.04);
        }

        .color-pill.active {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1a1a2e;
        }

        .color-pill .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        /* KARTLAR */
        .cards-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card-wrapper {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .card-wrapper:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .card-inner {
            padding: 28px 20px 20px;
            text-align: center;
        }

        .card-apple-icon {
            width: 24px;
            height: 30px;
            margin: 0 auto 10px;
            position: relative;
        }

        .card-apple-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 24px;
            border: 2.5px solid #1a1a2e;
            border-radius: 5px;
        }

        .card-apple-icon::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 2.5px;
            background: #1a1a2e;
            border-radius: 2px;
        }

        .card-model-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 1px;
        }

        .card-model-name {
            font-size: 18px;
            font-weight: 800;
            color: #1a1a2e;
            margin: 3px 0 8px;
        }

        .card-color-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 6px 0 4px;
        }

        .card-color-dot {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #e5e7eb;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.05);
        }

        .card-color-text {
            font-size: 15px;
            font-weight: 600;
            color: #4b5563;
        }

        .card-number {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a2e;
            margin-top: 4px;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .card-footer {
            border-top: 1px solid #e5e7eb;
            padding: 8px 20px;
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            background: #f9fafb;
            letter-spacing: 0.8px;
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card-wrapper:hover .card-actions {
            opacity: 1;
        }

        .card-action-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(0,0,0,0.55);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-action-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        .card-action-btn.red:hover {
            background: #dc2626;
        }

        /* Toast mesaj */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .bottom-info {
            max-width: 1000px;
            margin: 30px auto 0;
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 700px) {
            .controls-bar { flex-direction: column; align-items: stretch; }
            .controls-bar .sep { display: none; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📱 iPhone Lens Kartı Oluşturucu</h1>
        <p>Modelleri aşağıya yaz, renk ve numara seç, her kartı tek tek resim olarak kaydet</p>
    </div>

    <!-- Kontrol Paneli -->
    <div class="controls-bar" id="controls-bar">
        <label>Model Adı:</label>
        <input type="text" id="model-input" placeholder="iPhone modelini yaz" value="iPhone 16" style="flex:1; min-width:140px;">

        <span class="sep">|</span>

        <label>Renk:</label>
        <div class="color-picker-group" id="color-picker">
            <div class="color-pill active" data-color="Siyah" data-hex="#2d2d2d">
                <span class="dot" style="background:#2d2d2d"></span> Siyah
            </div>
            <div class="color-pill" data-color="Beyaz" data-hex="#f5f5f0">
                <span class="dot" style="background:#f5f5f0"></span> Beyaz
            </div>
            <div class="color-pill" data-color="Pembe" data-hex="#f4a4b8">
                <span class="dot" style="background:#f4a4b8"></span> Pembe
            </div>
            <div class="color-pill" data-color="Deniz Mavisi" data-hex="#7ec8c1">
                <span class="dot" style="background:#7ec8c1"></span> Deniz Mavisi
            </div>
            <div class="color-pill" data-color="Laciverttaş" data-hex="#4a5c8a">
                <span class="dot" style="background:#4a5c8a"></span> Laciverttaş
            </div>
        </div>

        <span class="sep">|</span>

        <label>Numara:</label>
        <input type="text" id="number-input" placeholder="001" value="001" style="width:80px;">

        <button class="btn btn-success" id="add-btn">+ Kart Ekle</button>
        <button class="btn btn-danger" id="clear-btn">Temizle</button>
    </div>

    <!-- Kartlar -->
    <div class="cards-grid" id="cards-grid"></div>

    <div class="bottom-info">
        💡 Her kartın üzerine gelince sağ üstte <strong>📷 (resim kaydet)</strong> ve <strong>🗑 (sil)</strong> butonları çıkar
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========== Renk Tanımları ==========
        const COLORS = {
            'Siyah':        '#2d2d2d',
            'Beyaz':        '#f5f5f0',
            'Pembe':        '#f4a4b8',
            'Deniz Mavisi': '#7ec8c1',
            'Laciverttaş':  '#4a5c8a'
        };

        // ========== DOM ==========
        const modelInput = document.getElementById('model-input');
        const numberInput = document.getElementById('number-input');
        const colorPills = document.querySelectorAll('.color-pill');
        const addBtn = document.getElementById('add-btn');
        const clearBtn = document.getElementById('clear-btn');
        const grid = document.getElementById('cards-grid');
        const toast = document.getElementById('toast');

        let selectedColor = 'Siyah';
        let selectedHex = '#2d2d2d';

        // ========== Toast ==========
        function showToast(msg, duration) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration || 1800);
        }

        // ========== Renk Seçimi ==========
        colorPills.forEach(pill => {
            pill.addEventListener('click', function() {
                colorPills.forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                selectedColor = this.dataset.color;
                selectedHex = this.dataset.hex;
            });
        });

        // ========== Kart ID sayaç ==========
        let cardIdCounter = 0;

        // ========== Yeni Kart Ekle ==========
        function addCard(modelName, colorName, colorHex, number) {
            const id = ++cardIdCounter;

            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.dataset.id = id;

            wrapper.innerHTML = `
                <div class="card-actions">
                    <button class="card-action-btn save-btn" title="Resim Olarak Kaydet">📷</button>
                    <button class="card-action-btn red delete-btn" title="Kartı Sil">🗑</button>
                </div>
                <div class="card-inner">
                    <div class="card-apple-icon"></div>
                    <div class="card-model-label">${escapeHtml(modelName)}</div>
                    <div class="card-model-name">${escapeHtml(modelName)}</div>
                    <div class="card-color-row">
                        <span class="card-color-dot" style="background:${colorHex}"></span>
                        <span class="card-color-text">${escapeHtml(colorName)}</span>
                    </div>
                    <div class="card-number">${escapeHtml(number)}</div>
                </div>
                <div class="card-footer">✦ APPLE LENS KARTI ✦</div>
            `;

            // Sil butonu
            wrapper.querySelector('.delete-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                wrapper.remove();
                showToast('🗑 Kart silindi');
            });

            // Kaydet butonu
            wrapper.querySelector('.save-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                saveCardAsImage(wrapper);
            });

            // Kartın kendine tıklayınca da kaydet (alternatif)
            // wrapper.addEventListener('click', function() {
            //     saveCardAsImage(wrapper);
            // });

            grid.appendChild(wrapper);

            // Animasyon için hafif scroll
            setTimeout(() => {
                wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);

            return id;
        }

        // ========== HTML Escape ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== Kartı Resim Olarak Kaydet (html2canvas) ==========
        function saveCardAsImage(wrapper) {
            const modelName = wrapper.querySelector('.card-model-label').textContent.trim();
            const colorName = wrapper.querySelector('.card-color-text').textContent.trim();
            const number = wrapper.querySelector('.card-number').textContent.trim();

            // Dosya adı
            const safeModel = modelName.replace(/[^a-zA-Z0-9ÇçĞğİıÖöŞşÜü\- ]/g, '').replace(/\s+/g, '_') || 'iPhone';
            const fileName = `${safeModel}_${colorName}_${number}.png`;

            // Kaydet butonunu gizle (geçici)
            const actions = wrapper.querySelector('.card-actions');
            actions.style.display = 'none';

            // html2canvas ile çek
            html2canvas(wrapper, {
                scale: 2.5,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false,
                width: wrapper.offsetWidth,
                height: wrapper.offsetHeight
            }).then(canvas => {
                // Butonu geri getir
                actions.style.display = 'flex';

                // İndir
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('✅ ' + fileName + ' indirildi!');
            }).catch(err => {
                actions.style.display = 'flex';
                console.error('html2canvas hatası:', err);
                showToast('❌ Hata oluştu, tekrar dene', 2500);
            });
        }

        // ========== "Kart Ekle" Butonu ==========
        addBtn.addEventListener('click', function() {
            const model = modelInput.value.trim();
            const number = numberInput.value.trim();

            if (!model) {
                showToast('⚠ Lütfen model adı yaz', 2000);
                modelInput.focus();
                return;
            }
            if (!number) {
                showToast('⚠ Lütfen numara yaz', 2000);
                numberInput.focus();
                return;
            }

            addCard(model, selectedColor, selectedHex, number);
            showToast('✅ Kart eklendi!');
        });

        // ========== Enter tuşu ile ekle ==========
        numberInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });
        modelInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                numberInput.focus();
            }
        });

        // ========== Tümünü Temizle ==========
        clearBtn.addEventListener('click', function() {
            if (grid.children.length === 0) {
                showToast('Zaten hiç kart yok');
                return;
            }
            if (confirm('Tüm kartları silmek istediğine emin misin?')) {
                grid.innerHTML = '';
                showToast('🗑 Tüm kartlar silindi');
            }
        });

        // ========== İlk örnek kartlar ==========
        // Başlangıçta birkaç örnek ekleyelim
        document.addEventListener('DOMContentLoaded', function() {
            // Kullanıcı hemen kendi modellerini eklesin diye örnek bırakmıyorum
            // İstersen aşağıdaki satırları aktif edebilirsin
            // addCard('iPhone 16 128GB', 'Siyah', '#2d2d2d', '001');
            // addCard('iPhone 16 Plus 256GB', 'Deniz Mavisi', '#7ec8c1', '002');
            // addCard('iPhone 16e 128GB', 'Beyaz', '#f5f5f0', '003');
        });
    </script>

</body>
</html>
