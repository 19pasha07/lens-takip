<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İPHONE LENS SİPARİŞ SİSTEMİ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f4f4f7; padding: 0; margin: 0; padding-top: 95px; }
        .container { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .main-title { text-align: center; color: #007aff; border-bottom: 3px solid #007aff; padding-bottom: 10px; margin: 0 0 10px 0; font-size: 24px; font-weight: 900; }
        .date-subtitle { text-align: center; color: #333; font-size: 16px; margin-bottom: 15px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 10px; position: fixed; top: 0; left: 0; right: 0; background: white; padding: 15px; border-bottom: 2px solid #007aff; z-index: 9999; }
        button { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 11px; color: white; cursor: pointer; text-transform: uppercase; }
        .save-btn { background: #28a745; } 
        .reset-btn { background: #ff3b30; }

        /* KAMERA GRUBU */
        .camera-group { margin-bottom: 15px; border: 2px solid #5856d6; border-radius: 12px; overflow: hidden; background: white; }
        .camera-group-header { background: #5856d6; color: white; padding: 10px 12px; font-weight: bold; font-size: 14px; text-align: center; }
        .camera-group-header .models-list { font-size: 11px; font-weight: normal; opacity: 0.9; display: block; margin-top: 3px; }

        /* MODEL SATIRI */
        .model-row { border-bottom: 1px solid #e0e0e0; }
        .model-row:last-child { border-bottom: none; }
        .model-row-header { background: #f0f0f5; padding: 8px 12px; font-weight: bold; font-size: 14px; color: #333; }
        
        .color-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 24px; border-bottom: 1px solid #f0f0f0; }
        .color-row:last-child { border-bottom: none; }
        .color-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .color-dot { min-width: 20px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
        
        input { width: 70px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 900; color: #333; }
        
        /* SONUÇ EKRANI */
        .save-notice { background: #1c1c1e; color: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 16px; }
        .result-item { background: #f9f9f9; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 18px; border-bottom: 1px solid #eee; }
        .result-item:last-child { border-bottom: none; }
        .result-model-badge { font-size: 11px; color: #888; font-weight: normal; background: #e8e8ed; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
    </style>
</head>
<body>

<div class="btn-group" id="controls">
    <button class="reset-btn" onclick="window.location.reload()">TEMİZLE</button>
    <button class="save-btn" onclick="finishProcess()">LİSTELE VE RESİM OLARAK KAYDET</button>
</div>

<div class="container" id="app">
    <div id="captureArea" style="padding: 15px; background: white;">
        <h1 class="main-title">İPHONE KAMERA LENS</h1>
        <div class="date-subtitle" id="dateDisplay"></div>
        <div id="list"></div>
    </div>
</div>

<script>
    document.getElementById('dateDisplay').innerText = "Tarih: " + new Date().toLocaleDateString('tr-TR');

    // ========== RENK KODLARI ==========
    const colorMap = {
        "Beyaz": "#f5f5f7", "Siyah": "#1d1d1f", "Mor": "#b8afdb", "Sarı": "#f9d023", "Yeşil": "#ade0c1", "Kırmızı": "#e11c2a",
        "Gece Yarısı": "#191f28", "Yıldız Işığı": "#faf7f2", "Mavi": "#4a7eb3", "Pembe": "#fadde5", "Altın": "#f5e3c8", "Gümüş": "#e2e4e1",
        "Gece Yeşili": "#4e5851", "Uzay Grisi": "#535150", "Pasifik Mavisi": "#28475c", "Grafit": "#4b4a45", "Sierra Mavisi": "#9ebbd7",
        "Ladin Yeşili": "#505c4d", "Uzay Siyahı": "#242323", "Derin Mor": "#594f63", "Beyaz Titanyum": "#f2f1ed", "Mavi Titanyum": "#3b445a",
        "Natürel Titanyum": "#bcb6ac", "Siyah Titanyum": "#3d3d3b", "Ultramarin": "#5057d0", "Teal (Turkuaz)": "#b3d9d6", "Çöl Titanyumu": "#bba48b",
        "Koyu Titanyum": "#353535", "Doğal Titanyum": "#bcb6ac",
        "Turuncu": "#FF6B35"
    };

    // ========== KAMERA GRUPLARI ==========
    // Aynı fiziksel lens dizilimine sahip modeller
    const cameraGroups = [
        {
            id: "cift_dikey",
            name: "📷 Çift Kamera (Dikey)",
            models: [
                "iPhone 11", "iPhone 12", "iPhone 12 Mini",
                "iPhone 13", "iPhone 13 Mini",
                "iPhone 14", "iPhone 14 Plus",
                "iPhone 15", "iPhone 15 Plus",
                "iPhone 16", "iPhone 16 Plus",
                "iPhone 16E",
                "iPhone 17", "iPhone 17 Plus", "iPhone 17 Air"
            ]
        },
        {
            id: "uclu_ucgen",
            name: "📷 Üçlü Kamera (Üçgen)",
            models: [
                "iPhone 11 Pro", "iPhone 11 Pro Max",
                "iPhone 12 Pro", "iPhone 12 Pro Max",
                "iPhone 13 Pro", "iPhone 13 Pro Max",
                "iPhone 14 Pro", "iPhone 14 Pro Max",
                "iPhone 15 Pro", "iPhone 15 Pro Max"
            ]
        },
        {
            id: "uclu_yatay",
            name: "📷 Üçlü Kamera (Yatay Tasarım)",
            models: [
                "iPhone 16 Pro", "iPhone 16 Pro Max",
                "iPhone 17 Pro", "iPhone 17 Pro Max"
            ]
        }
    ];

    // ========== TÜM MODELLER VE RENKLERİ ==========
    const allModels = [
        { m: "iPhone 11", c: ["Siyah", "Beyaz", "Mor", "Sarı", "Yeşil", "Kırmızı"] },
        { m: "iPhone 11 Pro", c: ["Gece Yeşili", "Uzay Grisi", "Gümüş", "Altın"] },
        { m: "iPhone 11 Pro Max", c: ["Gece Yeşili", "Uzay Grisi", "Gümüş", "Altın"] },
        { m: "iPhone 12", c: ["Siyah", "Beyaz", "Mavi", "Yeşil", "Kırmızı", "Mor"] },
        { m: "iPhone 12 Mini", c: ["Siyah", "Beyaz", "Mavi", "Yeşil", "Kırmızı", "Mor"] },
        { m: "iPhone 12 Pro", c: ["Pasifik Mavisi", "Grafit", "Altın", "Gümüş"] },
        { m: "iPhone 12 Pro Max", c: ["Pasifik Mavisi", "Grafit", "Altın", "Gümüş"] },
        { m: "iPhone 13", c: ["Gece Yarısı", "Yıldız Işığı", "Mavi", "Pembe", "Yeşil", "Kırmızı"] },
        { m: "iPhone 13 Mini", c: ["Gece Yarısı", "Yıldız Işığı", "Mavi", "Pembe", "Yeşil", "Kırmızı"] },
        { m: "iPhone 13 Pro", c: ["Sierra Mavisi", "Grafit", "Altın", "Gümüş", "Ladin Yeşili"] },
        { m: "iPhone 13 Pro Max", c: ["Sierra Mavisi", "Grafit", "Altın", "Gümüş", "Ladin Yeşili"] },
        { m: "iPhone 14", c: ["Gece Yarısı", "Yıldız Işığı", "Mavi", "Mor", "Sarı", "Kırmızı"] },
        { m: "iPhone 14 Plus", c: ["Gece Yarısı", "Yıldız Işığı", "Mavi", "Mor", "Sarı", "Kırmızı"] },
        { m: "iPhone 14 Pro", c: ["Uzay Siyahı", "Derin Mor", "Altın", "Gümüş"] },
        { m: "iPhone 14 Pro Max", c: ["Uzay Siyahı", "Derin Mor", "Altın", "Gümüş"] },
        { m: "iPhone 15", c: ["Siyah", "Mavi", "Yeşil", "Sarı", "Pembe"] },
        { m: "iPhone 15 Plus", c: ["Siyah", "Mavi", "Yeşil", "Sarı", "Pembe"] },
        { m: "iPhone 15 Pro", c: ["Siyah Titanyum", "Beyaz Titanyum", "Natürel Titanyum", "Mavi Titanyum"] },
        { m: "iPhone 15 Pro Max", c: ["Siyah Titanyum", "Beyaz Titanyum", "Natürel Titanyum", "Mavi Titanyum"] },
        { m: "iPhone 16", c: ["Siyah", "Beyaz", "Pembe", "Teal (Turkuaz)", "Ultramarin"] },
        { m: "iPhone 16 Plus", c: ["Siyah", "Beyaz", "Pembe", "Teal (Turkuaz)", "Ultramarin"] },
        { m: "iPhone 16E", c: ["Siyah", "Beyaz"] },
        { m: "iPhone 16 Pro", c: ["Siyah Titanyum", "Beyaz Titanyum", "Natürel Titanyum", "Çöl Titanyumu"] },
        { m: "iPhone 16 Pro Max", c: ["Siyah Titanyum", "Beyaz Titanyum", "Natürel Titanyum", "Çöl Titanyumu"] },
        { m: "iPhone 17", c: ["Siyah", "Gümüş", "Natürel Titanyum", "Mavi", "Yeşil"] },
        { m: "iPhone 17 Plus", c: ["Siyah", "Gümüş", "Natürel Titanyum", "Mavi", "Yeşil"] },
        { m: "iPhone 17 Air", c: ["Siyah", "Gümüş", "Natürel Titanyum", "Mavi", "Yeşil"] },
        { m: "iPhone 17 Pro", c: ["Siyah Titanyum", "Beyaz Titanyum", "Doğal Titanyum", "Turuncu"] },
        { m: "iPhone 17 Pro Max", c: ["Siyah Titanyum", "Beyaz Titanyum", "Doğal Titanyum", "Turuncu"] }
    ];

    // ========== ARAYÜZÜ OLUŞTUR ==========
    const listDiv = document.getElementById('list');

    cameraGroups.forEach(group => {
        // Grup içindeki modelleri filtrele
        const groupModels = allModels.filter(m => group.models.includes(m.m));
        if (groupModels.length === 0) return;

        // Model isimlerini yan yana yaz
        const modelNamesStr = group.models.join(' • ');

        let html = `<div class="camera-group">
            <div class="camera-group-header">
                ${group.name}
                <span class="models-list">${modelNamesStr}</span>
            </div>`;

        // Her model için ayrı satır
        groupModels.forEach(model => {
            html += `<div class="model-row">
                <div class="model-row-header">${model.m}</div>`;

            model.c.forEach(color => {
                const code = colorMap[color] || "#555";
                let isLight = ["Beyaz", "Yıldız Işığı", "Gümüş", "Beyaz Titanyum"].includes(color);
                let textStyle = (color === "Sarı") ? "color:#d4af37; text-shadow: 0 0 1px #000;" : (isLight ? "color:#888;" : `color:${code};`);
                if (color === "Gece Yeşili") textStyle = `color:${code}; font-weight:900;`;

                html += `<div class="color-row">
                    <div class="color-info">
                        <div class="color-dot" style="background:${code}; border: 1px solid ${isLight ? '#bbb' : 'transparent'};"></div>
                        <span style="font-weight:bold; ${textStyle}">${color}</span>
                    </div>
                    <input type="number" class="lens-count" data-model="${model.m}" data-color="${color}" data-code="${code}" placeholder="0">
                </div>`;
            });

            html += `</div>`; // model-row kapat
        });

        html += `</div>`; // camera-group kapat
        listDiv.innerHTML += html;
    });

    // ========== GÖNDER / KAYDET ==========
    async function finishProcess() {
        const inputs = document.querySelectorAll('.lens-count');
        let orders = {};
        let hasOrder = false;

        inputs.forEach(input => {
            const val = parseInt(input.value);
            if (val > 0) {
                const model = input.getAttribute('data-model');
                const color = input.getAttribute('data-color');
                const code = input.getAttribute('data-code');

                if (!orders[model]) orders[model] = [];
                let existing = orders[model].find(o => o.color === color);
                if (existing) {
                    existing.count += val;
                } else {
                    orders[model].push({ color, count: val, code });
                }
                hasOrder = true;
            }
        });

        if (!hasOrder) return alert("Lütfen adet giriniz!");

        // Listeyi yeniden oluştur (sadece siparişler)
        listDiv.innerHTML = "";
        for (let model in orders) {
            let gDiv = document.createElement('div');
            gDiv.className = 'camera-group';
            gDiv.innerHTML = `<div class="camera-group-header" style="background:#007aff;">${model}</div>`;
            
            orders[model].forEach(item => {
                let isLight = ["Beyaz", "Yıldız Işığı", "Gümüş", "Beyaz Titanyum"].includes(item.color);
                let textStyle = (item.color === "Sarı") ? "color:#d4af37;" : (isLight ? "color:#888;" : `color:${item.code};`);
                if (item.color === "Gece Yeşili") textStyle = `color:${item.code};`;

                gDiv.innerHTML += `<div class="result-item">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div class="color-dot" style="background:${item.code}; border:1px solid #ccc;"></div>
                        <span style="${textStyle}">${item.color}</span>
                    </div>
                    <span>${item.count} ADET</span>
                </div>`;
            });
            listDiv.appendChild(gDiv);
        }

        // Fotoğraf çek
        document.getElementById('controls').style.display = "none";
        const canvas = await html2canvas(document.querySelector("#captureArea"), { scale: 3 });
        const imgData = canvas.toDataURL("image/png");

        document.body.innerHTML = `
            <div style="text-align:center; padding:15px; background:#f4f4f7; min-height:100vh;">
                <div class="save-notice">👍 TAMAMDIR! Basılı tut ve fotoğraflara kaydet.</div>
                <img src="${imgData}" style="width:100%; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.3);">
                <button onclick="window.location.reload()" style="width:100%; margin-top:25px; padding:25px; background:#1c1c1e; color:white; border-radius:15px; font-weight:900; font-size:26px; border:none;">
                    ⬅️ ANA SAYFAYA DÖN
                </button>
            </div>`;
    }
</script>
</body>
</html>
