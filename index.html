<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Renk Paleti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            padding: 16px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 14px;
        }
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: #f5f5f7;
            padding: 10px 0 14px;
            border-bottom: 1px solid #e8e8ed;
        }
        .btn {
            padding: 11px 24px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-foto { background: #34c759; color: white; }
        .btn-foto:hover { background: #28a745; transform: scale(1.02); }
        .btn-select { background: #0071e3; color: white; }
        .btn-select:hover { background: #0077ed; transform: scale(1.02); }
        .btn-clear { background: #6c757d; color: white; }
        .btn-clear:hover { background: #5a6268; transform: scale(1.02); }

        #searchInput {
            padding: 10px 14px;
            border: 2px solid #d2d2d7;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            width: 240px;
        }
        #searchInput:focus { border-color: #0071e3; }

        .stats {
            text-align: center;
            color: #86868b;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .model-group {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
        }
        .model-group h2 {
            font-size: 17px;
            color: #1d1d1f;
            margin-bottom: 2px;
        }
        .model-group .sub {
            font-size: 11px;
            color: #86868b;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 8px;
        }

        .card {
            border-radius: 9px;
            overflow: hidden;
            border: 2px solid #e8e8ed;
            cursor: pointer;
            background: white;
            transition: 0.12s;
            user-select: none;
            -webkit-user-select: none;
        }
        .card.selected { border-color: #0071e3; box-shadow: 0 0 0 1px #0071e3; }
        .card:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.06); }

        .swatch {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .swatch .check {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0071e3;
            font-weight: bold;
            opacity: 0;
            transition: 0.12s;
        }
        .card.selected .swatch .check { opacity: 1; }

        .info { padding: 7px 9px 9px; }
        .info .name { font-size: 12px; font-weight: 600; color: #1d1d1f; }
        .info .no {
            width: 100%;
            padding: 4px 5px;
            border: 1px solid #d2d2d7;
            border-radius: 6px;
            font-size: 11px;
            margin-top: 4px;
            outline: none;
            text-align: center;
            background: #fafafa;
        }
        .info .no:focus { border-color: #0071e3; background: white; }

        /* ===== FOTOĞRAF ÇIKTI ALANI ===== */
        #outputArea {
            display: none;
            max-width: 520px;
            margin: 30px auto;
            background: white;
            border-radius: 18px;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        #outputArea h3 {
            font-size: 16px;
            color: #1d1d1f;
            margin-bottom: 14px;
        }
        #outputArea .note {
            font-size: 12px;
            color: #86868b;
            margin-bottom: 14px;
        }
        #outputInner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #outputInner .foto-card {
            background: #f9f9fb;
            border-radius: 14px;
            padding: 10px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #e8e8ed;
        }
        #outputInner .foto-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            -webkit-touch-callout: default;
            pointer-events: auto;
            cursor: pointer;
        }
        #outputInner .foto-label {
            font-size: 12px;
            color: #555;
            margin-top: 6px;
            font-weight: 500;
        }
        .btn-clear-output {
            margin-top: 6px;
            background: #ff3b30;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-clear-output:hover { background: #d63031; }

        .toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1d1d1f;
            color: white;
            padding: 12px 24px;
            border-radius: 11px;
            font-size: 14px;
            opacity: 0;
            transition: 0.35s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            h1 { font-size: 20px; }
            .top-bar { gap: 6px; }
            .btn { padding: 9px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <input type="text" id="searchInput" placeholder="🔍 Model veya renk ara..." oninput="filterModels()">

// ======================== UYGULAMA ========================
let selectedColors = new Set();

function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    colorData.forEach((g, mi) => {
        const div = document.createElement('div');
        div.className = 'model-group';
        const h2 = document.createElement('h2');
        h2.textContent = g.model;
        div.appendChild(h2);
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = g.colors.length + ' renk';
        div.appendChild(sub);
        const grid = document.createElement('div');
        grid.className = 'grid';
        g.colors.forEach((c, ci) => {
            const key = mi + '-' + ci;
            const card = document.createElement('div');
            card.className = 'card' + (selectedColors.has(key) ? ' selected' : '');
            const sw = document.createElement('div');
            sw.className = 'swatch';
            sw.style.background = c.hex;
            if (['#F0EFED','#EDE8DF','#F5F3EF','#EAE7E0','#E3E2DC','#F5B7B1','#F4D7B3','#E8D5B0','#F2D06B','#F7E87A','#C4BCB0','#F5A0A0'].includes(c.hex)) {
                sw.style.borderBottom = '1px solid #d2d2d7';
            }
            const chk = document.createElement('div');
            chk.className = 'check';
            chk.textContent = '✓';
            sw.appendChild(chk);
            card.appendChild(sw);
            const info = document.createElement('div');
            info.className = 'info';
            const nm = document.createElement('div');
            nm.className = 'name';
            nm.textContent = c.tr;
            info.appendChild(nm);
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'no';
            inp.placeholder = 'No';
            inp.dataset.key = key;
            inp.addEventListener('click', e => e.stopPropagation());
            info.appendChild(inp);
            card.appendChild(info);
            card.addEventListener('click', function() {
                if (selectedColors.has(key)) { selectedColors.delete(key); card.classList.remove('selected'); }
                else { selectedColors.add(key); card.classList.add('selected'); }
                updateStats();
            });
            grid.appendChild(card);
        });
        div.appendChild(grid);
        app.appendChild(div);
    });
    updateStats();
}

function updateStats() { document.getElementById('stats').textContent = 'Seçili: ' + selectedColors.size + ' renk'; }
function selectAll() {
    document.querySelectorAll('.card').forEach(c => {
        const key = c.querySelector('.no').dataset.key;
        selectedColors.add(key); c.classList.add('selected');
    });
    updateStats();
}
function deselectAll() {
    document.querySelectorAll('.card').forEach(c => {
        const key = c.querySelector('.no').dataset.key;
        selectedColors.delete(key); c.classList.remove('selected');
    });
    updateStats();
}
function filterModels() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.model-group').forEach(g => { g.style.display = g.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}

// ======================== FOTOĞRAF OLUŞTUR ========================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

function fotografOlustur() {
    if (selectedColors.size === 0) { showToast('Lütfen en az bir renk seçin!'); return; }

    const output = document.getElementById('outputInner');
    output.innerHTML = '';
    document.getElementById('outputArea').style.display = 'block';

    selectedColors.forEach(key => {
        const [mi, ci] = key.split('-').map(Number);
        const g = colorData[mi];
        const c = g.colors[ci];
        const inp = document.querySelector('.no[data-key="' + key + '"]');
        const num = inp ? inp.value.trim() : '';

        const canvas = document.createElement('canvas');
        canvas.width = 500;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = c.hex;
        ctx.fillRect(0, 0, 500, 500);
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        ctx.fillRect(0, 0, 500, 3);

        const cx = 250, cy = 225;
        const fw = 148, fh = 266;
        const rad = 20;

        ctx.shadowColor = 'rgba(0,0,0,0.18)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;

        ctx.fillStyle = darken(c.hex, 55);
        roundRect(ctx, cx - fw/2, cy - fh/2, fw, fh, rad);
        ctx.fill();

        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

        ctx.fillStyle = c.hex;
        roundRect(ctx, cx - fw/2 + 6, cy - fh/2 + 6, fw - 12, fh - 12, rad - 2);
        ctx.fill();

        ctx.fillStyle = '#1d1d1f';
        roundRect(ctx, cx - 38, cy - fh/2 + 10, 76, 15, 7);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 17px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 4;
        ctx.fillText(g.model, cx, cy + fh/2 + 48);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 5;
        ctx.fillText(c.tr, cx, cy + fh/2 + 80);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(c.en, cx, cy + fh/2 + 100);

        if (num) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            roundRect(ctx, 16, 16, 60, 34, 9);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('#' + num, 46, 39);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('iPhone Renk Paleti', 250, 490);

        const card = document.createElement('div');
        card.className = 'foto-card';

        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        img.alt = g.model + ' - ' + c.tr;
        img.style.cursor = 'pointer';
        card.appendChild(img);

        const label = document.createElement('div');
        label.className = 'foto-label';
        let txt = g.model + ' — ' + c.tr;
        if (num) txt += ' (#' + num + ')';
        label.textContent = txt;
        card.appendChild(label);

        output.appendChild(card);
    });

    document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
    showToast(selectedColors.size + ' fotoğraf oluşturuldu! Basılı tutup kaydedebilirsin.');
}

function temizleCikti() {
    document.getElementById('outputInner').innerHTML = '';
    document.getElementById('outputArea').style.display = 'none';
}

function darken(hex, p) {
    const n = parseInt(hex.replace('#',''), 16);
    const a = Math.round(2.55 * p);
    const R = Math.max(0, (n>>16) - a);
    const G = Math.max(0, ((n>>8)&0xFF) - a);
    const B = Math.max(0, (n&0xFF) - a);
    return 'rgb('+R+','+G+','+B+')';
}
function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
}

render();
</script>
